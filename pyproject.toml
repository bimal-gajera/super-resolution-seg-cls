[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superres"
version = "0.1.0"
description = "PixelDiT super-resolution as a frozen front-end for Sentinel-2 segmentation and classification"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "timm",
    "numpy",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "scikit-image",
    "scipy",
    "pandas",
    "pyarrow",
    "einops",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "pillow",
]

# The classification track needs torchgeo-bench, which pulls torchgeo and
# lightning. It is an extra rather than a core dependency so the segmentation
# pipeline stays installable without them -- the two tracks run in separate
# environments (envs/env_sr and envs/superres) for exactly that reason.
[project.optional-dependencies]
classification = [
    "torchgeo-bench>=0.5",
    "scikit-learn",
    "h5py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
